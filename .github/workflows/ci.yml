name: CI

on:
  pull_request:

jobs:
  intelligence-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/intelligence/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.lock && python -m pip install --no-deps -e .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy app
      - name: Test
        run: pytest
      - name: Build Docker image
        run: docker build -t insighthub-intelligence:ci .
