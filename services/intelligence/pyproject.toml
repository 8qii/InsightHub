[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "insighthub-intelligence"
version = "0.1.0"
description = "InsightHub FastAPI Intelligence Service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.12",
    "httpx==0.28.1",
    "SQLAlchemy==2.0.40",
    "asyncpg==0.30.0",
    "pydantic-settings==2.8.1",
    "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "mypy==1.15.0",
    "pytest==8.3.5",
    "ruff==0.11.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
warn_unreachable = true

[tool.setuptools.packages.find]
include = ["app*"]
