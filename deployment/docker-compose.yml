services:
  anythingllm:
    image: mintplexlabs/anythingllm:1.16.1@sha256:05617e7bece7fd6eddc4f5b4176cd87fff74d7da88d988a6109b95481cce122c
    cap_add:
      - SYS_ADMIN
    environment:
      LLM_PROVIDER: generic-openai
      GENERIC_OPEN_AI_BASE_PATH: ${LLM_BASE_URL:-}
      GENERIC_OPEN_AI_API_KEY: ${LLM_API_KEY:-}
      GENERIC_OPEN_AI_MODEL_PREF: ${LLM_MODEL:-gpt-5.6-luna}
      EMBEDDING_ENGINE: ${ANYTHINGLLM_EMBEDDING_ENGINE:-native}
      EMBEDDING_MODEL_PREF: ${EMBEDDING_MODEL:-Xenova/all-MiniLM-L6-v2}
      STORAGE_DIR: /app/server/storage
    ports:
      - "3001:3001"
    volumes:
      - anythingllm-storage:/app/server/storage
    networks:
      - insighthub

  intelligence:
    build:
      context: ../services/intelligence
      dockerfile: Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-insighthub}
      APP_ENV: ${APP_ENV:-development}
      ANYTHINGLLM_BASE_URL: ${ANYTHINGLLM_BASE_URL:-http://anythingllm:3001}
      ANYTHINGLLM_API_KEY: ${ANYTHINGLLM_API_KEY:-}
      ANYTHINGLLM_TIMEOUT_SECONDS: ${ANYTHINGLLM_TIMEOUT_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATA_DIR: ${DATA_DIR:-/app/data}
      DUCKDB_PATH: ${DUCKDB_PATH:-/data/analytics.duckdb}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-100}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-nova_retail}
      POSTGRES_USER: ${POSTGRES_USER:-nova_retail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${INTELLIGENCE_PORT:-8000}:8000"
    volumes:
      - intelligence-data:${DATA_DIR:-/app/data}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - insighthub

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-nova_retail}
      POSTGRES_USER: ${POSTGRES_USER:-nova_retail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nova-retail-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-nova_retail} -d ${POSTGRES_DATABASE:-nova_retail}
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - insighthub

volumes:
  anythingllm-storage:
  intelligence-data:
  nova-retail-postgres-data:

networks:
  insighthub:
    driver: bridge
